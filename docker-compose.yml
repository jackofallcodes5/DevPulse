version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: devpulse_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devpulse_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-devpulse}
      MYSQL_USER: ${MYSQL_USER:-devpulse}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-devpulse_pass}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${MYSQL_ROOT_PASSWORD:-devpulse_root}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: devpulse_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-devpulse_redis}
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REDIS_PASSWORD:-devpulse_redis}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
